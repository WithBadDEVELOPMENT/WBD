<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survey — With Bad DEVELOPMENT</title>
<link rel="icon" type="image/jpeg" href="../channels4_profile (1).jpg">

<!-- Google Fonts loaded directly via HTML links so they never fail to load -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--void:#090d0a;--panel:#101711;--paper:#e6eee6;--muted:#7d8b7d;--wire:#26352a;--green:#42ff72;--mono:'JetBrains Mono',monospace;--display:'Oswald',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--paper);font-family:var(--mono);line-height:1.6;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(66,255,114,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(66,255,114,.025) 1px,transparent 1px);background-size:42px 42px}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--wire);background:rgba(9,13,10,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.nav{max-width:1080px;margin:auto;padding:16px 6vw;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{font-family:var(--display);font-size:20px;font-weight:700;display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;object-fit:cover;border:1px solid var(--wire)}
.back{color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--green);padding:7px 11px;transition:.25s}
.back:hover{background:var(--green);color:var(--void);box-shadow:0 0 20px rgba(66,255,114,.2)}
main{max-width:900px;margin:auto;padding:80px 6vw}
.label{color:var(--green);font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:14px}
h1{font-family:var(--display);font-size:clamp(42px,8vw,80px);text-transform:uppercase;line-height:1;margin-bottom:20px}
.intro{color:#aebaae;max-width:650px;font-size:14px;margin-bottom:45px}
.terminal{background:#080d09;border:1px solid var(--wire);padding:20px;margin-bottom:45px;color:#8dff9f;box-shadow:0 0 30px rgba(66,255,114,.04)}
.terminal span{color:var(--green)}

/* Interactive Embedded Poll Layout */
.poll-section {
    margin-bottom: 45px;
}
.poll-section h2 {
    font-family: var(--display);
    text-transform: uppercase;
    font-size: 24px;
    color: var(--green);
    margin-bottom: 15px;
    letter-spacing: .05em;
}
.poll-frame-container {
    background: var(--panel);
    border: 1px solid var(--wire);
    padding: 20px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
    position: relative;
    border-radius: 4px;
    transition: border-color 0.25s ease;
}
.poll-frame-container:hover {
    border-color: var(--green);
    box-shadow: 0 0 15px rgba(66,255,114,.05);
}
/* This forces the embedded WakaTime frame to look clean on both desktop and mobile layouts */
.poll-frame-container iframe {
    width: 100%;
    height: 520px; /* Default height suitable for WakaTime options and graphs */
    border: none;
    background: #ffffff; /* WakaTime uses a clean light background for form rendering */
    display: block;
    border-radius: 2px;
}

footer{margin-top:60px;padding-top:25px;border-top:1px solid var(--wire);color:var(--muted);font-size:11px}
@media(max-width:650px){
    .nav{align-items:flex-start}
    .brand{font-size:17px}
    .brand img{width:38px;height:38px}
    .poll-frame-container iframe { height: 600px; } /* Gives a bit more height scrolling room on narrow screens */
}
</style>
</head>
<body>
<header>
<div class="nav">
<a class="brand" href="../"><img src="../channels4_profile (1).jpg" alt="With Bad Development logo"><span>WITH BAD DEVELOPMENT</span></a>
<a class="back" href="../">← Home</a>
</div>
</header>
<main>
<div class="label">// live.surveys</div>
<h1>Survey</h1>
<p class="intro">Cast your vote directly below. Your choices help shape our active development pipeline.</p>
<div class="terminal"><div>&gt; mounting_interactive_stream()</div><div>&gt; frame_status: <span>CONNECTED</span></div><div>&gt; target: <span>WAKATIME_POLL_API</span></div><div>&gt;_</div></div>

<!-- Core Interactive Live Poll -->
<div class="poll-section">
    <h2>// Active Poll Interface</h2>
    <div class="poll-frame-container">
        <!-- The live interactive iFrame that lets people interact without leaving your app -->
        <iframe 
            src="https://wakatime.com" 
            title="WakaTime Live Poll Dashboard"
            loading="lazy"
            allow="cross-origin-isolated">
        </iframe>
    </div>
</div>

<footer>WITH BAD DEVELOPMENT · SURVEY CENTER</footer>
</main>
</body>
</html>
