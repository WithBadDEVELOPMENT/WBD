<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survey — With Bad DEVELOPMENT</title>
<link rel="icon" type="image/jpeg" href="../channels4_profile (1).jpg">
<style>
@import url('https://googleapis.com');
:root{--void:#090d0a;--panel:#101711;--paper:#e6eee6;--muted:#7d8b7d;--wire:#26352a;--green:#42ff72;--mono:'JetBrains Mono',monospace;--display:'Oswald',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--paper);font-family:var(--mono);line-height:1.6;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(66,255,114,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(66,255,114,.025) 1px,transparent 1px);background-size:42px 42px}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--wire);background:rgba(9,13,10,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.nav{max-width:1080px;margin:auto;padding:16px 6vw;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{font-family:var(--display);font-size:20px;font-weight:700;display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;object-fit:cover;border:1px solid var(--wire)}
.back{color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--green);padding:7px 11px;transition:.25s}
.back:hover{background:var(--green);color:var(--void);box-shadow:0 0 20px rgba(66,255,114,.2)}
main{max-width:900px;margin:auto;padding:80px 6vw}
.label{color:var(--green);font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:14px}
h1{font-family:var(--display);font-size:clamp(42px,8vw,80px);text-transform:uppercase;line-height:1;margin-bottom:20px}
.intro{color:#aebaae;max-width:650px;font-size:14px;margin-bottom:45px}
.terminal{background:#080d09;border:1px solid var(--wire);padding:20px;margin-bottom:35px;color:#8dff9f;box-shadow:0 0 30px rgba(66,255,114,.04)}
.terminal span{color:var(--green)}
.survey-card{background:var(--panel);border:1px solid var(--wire);padding:24px;margin-bottom:18px;transition:0.3s}
.survey-card:hover{border-color:var(--green)}
.question-title{font-family:var(--display);text-transform:uppercase;font-size:21px;color:var(--green);margin-bottom:15px}
.options-list{display:flex;flex-direction:column;gap:10px}
.option-label{display:flex;align-items:center;gap:12px;background:rgba(9,13,10,0.5);border:1px solid var(--wire);padding:12px 16px;cursor:pointer;font-size:13px;transition:0.2s ease}
.option-label:hover{border-color:var(--green)}
.option-label input[type="radio"]{appearance:none;width:14px;height:14px;border:1px solid var(--wire);background:transparent;cursor:pointer;display:grid;place-content:center;transition:0.2s ease}
.option-label input[type="radio"]::before{content:"";width:6px;height:6px;transform:scale(0);transition:0.1s transform ease;background:var(--green);box-shadow:0 0 8px var(--green)}
.option-label input[type="radio"]:checked{border-color:var(--green)}
.option-label input[type="radio"]:checked::before{transform:scale(1)}
.submit-container{text-align:right;margin-top:25px}
.submit-btn{background:transparent;color:var(--green);border:1px solid var(--green);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;padding:12px 24px;cursor:pointer;transition:.25s}
.submit-btn:hover{background:var(--green);color:var(--void);box-shadow:0 0 20px rgba(66,255,114,.2)}
footer{margin-top:60px;padding-top:25px;border-top:1px solid var(--wire);color:var(--muted);font-size:11px}
@media(max-width:650px){.nav{align-items:flex-start}.brand{font-size:17px}.brand img{width:38px;height:38px}}
</style>
<script type="text/javascript" src="https://jsdelivr.net"></script>
</head>
<body>
<header>
<div class="nav">
<a class="brand" href="../"><img src="../channels4_profile (1).jpg" alt="logo"><span>WITH BAD DEVELOPMENT</span></a>
<a class="back" href="../">← Home</a>
</div>
</header>
<main>
<div class="label" id="survey-label">// live.surveys</div>
<h1 id="survey-title">Active Survey</h1>
<p class="intro" id="survey-intro">Select your answers below to transmit telemetry logs directly to development.</p>
<div class="terminal">
    <div>&gt; compile_runtime_stream()</div>
    <div>&gt; server_status: <span>ONLINE</span></div>
    <div>&gt; connection: <span>READY</span></div>
    <div>&gt;_</div>
</div>
<form id="dynamic-survey-form">
    <div id="survey-container"></div>
    <div class="submit-container">
        <button type="submit" class="submit-btn">Transmit Survey Telemetry →</button>
    </div>
</form>
<footer>WITH BAD DEVELOPMENT · SURVEY CENTER</footer>
</main>
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Authenticated API credentials linked up safely
    const P_KEY = "sFXveD7WBHt19lRyP", S_ID = "service_survey", T_ID = "Survey_Response";
    emailjs.init({ publicKey: P_KEY });

    // ==========================================
    // EASY CONFIG BOX: UPDATE YOUR SURVEY TEXT RIGHT HERE
    // ==========================================
    const surveyConfig = [
        {
            question: "Which feature should we build next?",
            options: ["Multiplayer Matchmaking Engine", "Advanced Developer API Sandbox", "Modding & Extension Support Docs"]
        },
        {
            question: "What is your preferred platform?",
            options: ["PC / Desktop Native Launcher", "Web App Sandbox / GitHub Pages Embed", "Mobile Interface Optimization"]
        }
    ];

    // ==========================================
    // RENDERING ENGINE (DO NOT TOUCH)
    // ==========================================
    const container = document.getElementById("survey-container");
    surveyConfig.forEach((q, idx) => {
        const qNum = idx + 1;
        const card = document.createElement("div");
        card.className = "survey-card";

        const h2 = document.createElement("h2");
        h2.className = "question-title";
        h2.innerText = `0${qNum}. ${q.question}`;
        card.appendChild(h2);

        const list = document.createElement("div");
        list.className = "options-list";

        q.options.forEach(opt => {
            const optId = `q_${qNum}_opt_${Math.random().toString(36).substr(2, 4)}`;
            const lbl = document.createElement("label");
            lbl.className = "option-label";
            lbl.setAttribute("for", optId);

            const rad = document.createElement("input");
            rad.type = "radio";
            rad.name = `Question 0${qNum}`;
            rad.id = optId;
            rad.value = opt;
            rad.required = true;

            const sp = document.createElement("span");
            sp.innerText = opt;

            lbl.appendChild(rad);
            lbl.appendChild(sp);
            list.appendChild(lbl);
        });

        card.appendChild(list);
        container.appendChild(card);
    });

    document.getElementById("dynamic-survey-form").addEventListener("submit", function(e) {
        e.preventDefault(); 
        const btn = this.querySelector(".submit-btn");
        btn.innerText = "TRANSMITTING DATA..."; 
        btn.disabled = true;

        let payload = "";
        new FormData(this).forEach((val, key) => { payload += `${key}: ${val}\n`; });

        emailjs.send(S_ID, T_ID, { survey_data: payload })
            .then(() => { 
                alert("Telemetry logs successfully transmitted directly to the development inbox!"); 
                this.reset(); 
            })
            .catch(() => { 
                alert("Transmission failed. Verify configurations."); 
            })
            .finally(() => { 
                btn.innerText = "Transmit Survey Telemetry →"; 
                btn.disabled = false; 
            });
    });
});
</script>
</body>
</html>
