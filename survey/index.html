<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survey — With Bad DEVELOPMENT</title>
<link rel="icon" type="image/jpeg" href="../channels4_profile (1).jpg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{--void:#090d0a;--panel:#101711;--paper:#e6eee6;--muted:#7d8b7d;--wire:#26352a;--green:#42ff72;--mono:'JetBrains Mono',monospace;--display:'Oswald',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--paper);font-family:var(--mono);line-height:1.6;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(66,255,114,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(66,255,114,.025) 1px,transparent 1px);background-size:42px 42px}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--wire);background:rgba(9,13,10,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.nav{max-width:1080px;margin:auto;padding:16px 6vw;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{font-family:var(--display);font-size:20px;font-weight:700;display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;object-fit:cover;border:1px solid var(--wire)}
.back{color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--green);padding:7px 11px;transition:.25s}
.back:hover{background:var(--green);color:var(--void);box-shadow:0 0 20px rgba(66,255,114,.2)}
main{max-width:900px;margin:auto;padding:80px 6vw}
.label{color:var(--green);font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:14px}
h1{font-family:var(--display);font-size:clamp(42px,8vw,80px);text-transform:uppercase;line-height:1;margin-bottom:20px}
.intro{color:#aebaae;max-width:650px;font-size:14px;margin-bottom:45px}
.terminal{background:#080d09;border:1px solid var(--wire);padding:20px;margin-bottom:45px;color:#8dff9f;box-shadow:0 0 30px rgba(66,255,114,.04)}
.terminal span{color:var(--green)}

/* Dynamic Survey Component Styles */
.survey-card {
    background: var(--panel);
    border: 1px solid var(--wire);
    padding: 24px;
    margin-bottom: 18px;
    transition: 0.3s;
}
.survey-card:hover {
    border-color: var(--green);
}
.question-title {
    font-family: var(--display);
    text-transform: uppercase;
    font-size: 21px;
    color: var(--green);
    margin-bottom: 15px;
}
.options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.option-label {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(9,13,10,0.5);
    border: 1px solid var(--wire);
    padding: 12px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s ease;
}
.option-label:hover {
    border-color: var(--green);
}
.option-label input[type="radio"] {
    appearance: none;
    width: 14px;
    height: 14px;
    border: 1px solid var(--wire);
    background: transparent;
    cursor: pointer;
    display: grid;
    place-content: center;
    transition: 0.2s ease;
}
.option-label input[type="radio"]::before {
    content: "";
    width: 6px;
    height: 6px;
    transform: scale(0);
    transition: 0.1s transform ease;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
}
.option-label input[type="radio"]:checked {
    border-color: var(--green);
}
.option-label input[type="radio"]:checked::before {
    transform: scale(1);
}
.submit-container {
    text-align: right;
    margin-top: 25px;
}
.submit-btn {
    background: transparent;
    color: var(--green);
    border: 1px solid var(--green);
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .12em;
    padding: 12px 24px;
    cursor: pointer;
    transition: .25s;
}
.submit-btn:hover {
    background: var(--green);
    color: var(--void);
    box-shadow: 0 0 20px rgba(66,255,114,.2);
}

footer{margin-top:60px;padding-top:25px;border-top:1px solid var(--wire);color:var(--muted);font-size:11px}
@media(max-width:650px){line.nav{align-items:flex-start}.brand{font-size:17px}.brand img{width:38px;height:38px}}
</style>
</head>
<body>
<header>
<div class="nav">
<a class="brand" href="../"><img src="../channels4_profile (1).jpg" alt="With Bad Development logo"><span>WITH BAD DEVELOPMENT</span></a>
<a class="back" href="../">← Home</a>
</div>
</header>
<main>
<div class="label" id="survey-label">// initializing.stream</div>
<h1 id="survey-title">Loading Survey</h1>
<p class="intro" id="survey-intro">Connecting with matrix document configuration files...</p>
<div class="terminal">
    <div>&gt; initialize_runtime_stream()</div>
    <div>&gt; config_file: <span id="terminal-file">SEARCHING_SURVEY_TXT</span></div>
    <div>&gt; runtime_status: <span id="terminal-status">PROCESSING</span></div>
    <div>&gt;_</div>
</div>

<form id="dynamic-survey-form">
    <div id="survey-container"></div>
    <div class="submit-container" id="submit-box" style="display: none;">
        <button type="submit" class="submit-btn">Transmit Survey Telemetry →</button>
    </div>
</form>

<footer>WITH BAD DEVELOPMENT · SURVEY CENTER</footer>
</main>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const sourceFile = "survey.txt";

    fetch(sourceFile)
        .then(response => {
            if (!response.ok) {
                throw new Error("Could not locate file matrix parameters.");
            }
            return response.text();
        })
        .then(text => {
            document.getElementById("terminal-file").innerText = "CONNECTED_SUCCESS";
            document.getElementById("terminal-status").innerText = "READY";
            document.getElementById("survey-label").innerText = "// live.surveys";

            const lines = text.split('\n');
            const container = document.getElementById("survey-container");
            
            let optionsListEl = null;
            let questionCount = 0;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith("[TITLE]")) {
                    document.getElementById("survey-title").innerText = trimmed.replace("[TITLE]", "").trim();
                } 
                else if (trimmed.startsWith("[INTRO]")) {
                    document.getElementById("survey-intro").innerText = trimmed.replace("[INTRO]", "").trim();
                } 
                else if (trimmed.startsWith("[QUESTION]")) {
                    questionCount++;
                    const questionText = trimmed.replace("[QUESTION]", "").trim();

                    const card = document.createElement("div");
                    card.className = "survey-card";

                    const h2 = document.createElement("h2");
                    h2.className = "question-title";
                    h2.innerText = `0${questionCount}. ${questionText}`;
                    card.appendChild(h2);

                    optionsListEl = document.createElement("div");
                    optionsListEl.className = "options-list";
                    card.appendChild(optionsListEl);

                    container.appendChild(card);
                } 
                else if (trimmed.startsWith("[OPTION]") && optionsListEl) {
                    const optionText = trimmed.replace("[OPTION]", "").trim();
                    const optionId = `q_${questionCount}_opt_${Math.random().toString(36).substr(2, 5)}`;

                    const label = document.createElement("label");
                    label.className = "option-label";
                    label.setAttribute("for", optionId);

                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = `question_${questionCount}`;
                    radio.id = optionId;
                    radio.value = optionText;
                    radio.required = true;

                    const textSpan = document.createElement("span");
                    textSpan.innerText = optionText;

                    label.appendChild(radio);
                    label.appendChild(textSpan);
                    optionsListEl.appendChild(label);
                }
            });

            if (questionCount > 0) {
                document.getElementById("submit-box").style.display = "block";
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById("terminal-file").innerText = "ERROR_FAILED_FETCH";
            document.getElementById("terminal-status").innerText = "OFFLINE";
            document.getElementById("survey-title").innerText = "Configuration Error";
            document.getElementById("survey-intro").innerText = "Ensure survey.txt is configured inside your active repository folder location.";
        });

    document.getElementById("dynamic-survey-form").addEventListener("submit", function(e) {
        e.preventDefault();
        alert("Telemetry logs submitted successfully!");
    });
});
</script>
</body>
</html>
