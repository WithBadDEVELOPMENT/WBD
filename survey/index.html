<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Developer Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        h1, h2 {
            color: #58a6ff;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
        }
        .poll-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .poll-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Code Space</h1>
        <p>Hi there! I'm a developer building cool things and tracking my progress.</p>
    </header>

    <main>
        <section>
            <h2>📊 My Live WakaTime Poll</h2>
            <div class="poll-container">
                <!-- This links to your poll page and displays the live updating image -->
                <a href="https://wakatime.com/polls/e00adeb0-79f4-42dc-87ff-0d8fc528ff30" target="_blank" rel="noopener noreferrer">
                    <img src="https://wakatime.com/polls/e00adeb0-79f4-42dc-87ff-0d8fc528ff30.png" alt="WakaTime Poll Stats">
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p style="text-align: center; color: #8b949e; margin-top: 40px; font-size: 0.85em;">
            Powered by WakaTime
        </p>
    </footer>

</body>
</html>
